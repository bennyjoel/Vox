name: Build VoxType

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pytest

    - name: Run tests
      run: |
        pytest tests/

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name VoxType --add-data "ui/frontend;ui/frontend" --add-data "assets;assets" main.py

    - name: Archive build
      uses: actions/upload-artifact@v3
      with:
        name: VoxType-Windows
        path: dist/VoxType/

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false

    - name: Upload Release Asset (ZIP)
      run: |
        Compress-Archive -Path dist/VoxType/* -DestinationPath VoxType.zip
      shell: powershell

    - name: Upload Release Artifact
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./VoxType.zip
        asset_name: VoxType.zip
        asset_content_type: application/zip
