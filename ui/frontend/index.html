<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxType</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/glass.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body class="pywebview-drag-region">
    
    <div id="widget-container" class="pill-container">
        <!-- Glowing background behind the mic -->
        <div class="glow-orb" id="glow-orb"></div>
        
        <div id="mic-btn" class="mic-icon" onclick="api.toggleRecording()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C10.3431 2 9 3.34315 9 5V11C9 12.6569 10.3431 14 12 14C13.6569 14 15 12.6569 15 11V5C15 3.34315 13.6569 2 12 2Z" fill="currentColor"/>
                <path d="M19 10V11C19 14.866 15.866 18 12 18C8.13401 18 5 14.866 5 11V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 18V22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M8 22H16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        
        <div class="status-container">
            <div id="status-text" class="status-text">Press ⇧ + Space to Dictate</div>
        </div>

        <div id="waveform-container" class="waveform-container">
            <canvas id="waveform" width="80" height="30"></canvas>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/state.js"></script>
    <script src="js/waveform.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
