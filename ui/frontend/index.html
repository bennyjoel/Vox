<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxType</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/glass.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body style="background: transparent; overflow: hidden; margin: 0; padding: 10px;">
    
    <div id="widget-container" class="glass-pill pywebview-drag-region">
        <div id="mic-btn" class="mic-icon" onclick="api.toggleRecording()">
            🎙️
        </div>
        
        <div class="status-container">
            <div id="status-text" class="status-text">Press ⇧ + ⌥ + Space to Dictate</div>
        </div>

        <div id="waveform-container" class="waveform-container" style="display:none;">
            <canvas id="waveform" width="100" height="40"></canvas>
        </div>
        
        <div class="drag-handle pywebview-drag-region">
            ⋮⋮
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/state.js"></script>
    <script src="js/waveform.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
